# Build the two images (slim + models baked), gate the conversion, smoke the result.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"      # weekly: pick up base-image and dependency fixes
  workflow_dispatch:

env:
  IMAGE: ghcr.io/gyhu-labs/reserv

permissions:
  contents: read
  packages: write
  id-token: write            # cosign keyless

jobs:
  models:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install conversion toolchain
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4" --index-url https://download.pytorch.org/whl/cpu
          # pins kept coherent: transformers 5.x + optimum-intel is broken upstream,
          # and we no longer use optimum-intel at all (see scripts/convert_models.py)
          pip install "openvino==2026.4.1" "transformers>=4.46,<6" "huggingface_hub<2" numpy
      - name: Convert to IR (fp16, models baked into the image)
        run: python scripts/convert_models.py --out artifacts/models --weight-format fp16
      - name: Conversion gate (parity vs torch fp32 references)
        run: python scripts/parity.py --models artifacts/models --fixtures fixtures --dtype fp16
      - uses: actions/upload-artifact@v4
        with:
          name: models-fp16
          path: artifacts/models
          retention-days: 14

  build:
    needs: models
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - name: bge
            models: true
          - name: slim
            models: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: matrix.models
        with:
          name: models-fp16
          path: models
      - name: Empty models dir for the slim image
        if: ${{ !matrix.models }}
        run: mkdir -p models
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.name }}
            type=semver,pattern={{version}}-${{ matrix.name }}
            type=sha,suffix=-${{ matrix.name }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Smoke test the built image
        if: ${{ matrix.models }}
        run: |
          docker build -t reserv:smoke .
          docker run -d --name reserv-smoke -p 8080:8080 -e RESERV_DEVICE=CPU \
            -e RESERV_API_KEYS="ci=ci-token" reserv:smoke
          # wait for the models to load
          for i in $(seq 1 60); do
            curl -sf localhost:8080/health >/dev/null && break || sleep 2
          done
          python3 - <<'PY'
          import json, urllib.request
          body = json.dumps({"query": "dywidenda PZU",
                             "documents": ["PZU wypłaci dywidendę 19,20 PLN brutto 8 października.",
                                           "Attic floor area is 71.30 m2 across 6 rooms."],
                             "top_n": 2}).encode()
          req = urllib.request.Request("http://localhost:8080/rerank", data=body,
                                       headers={"Content-Type": "application/json",
                                                "Authorization": "Bearer ci-token"})
          r = json.loads(urllib.request.urlopen(req, timeout=120).read())
          assert r["results"][0]["index"] == 0, r
          assert r["results"][0]["relevance_score"] > r["results"][1]["relevance_score"], r
          print("rerank ordering ok:", r["results"][0]["relevance_score"])
          PY
          docker logs reserv-smoke | tail -5
          docker rm -f reserv-smoke
      - name: Sign the published image
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: sigstore/cosign-installer@v3
      - name: cosign sign
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          for ref in ${{ steps.meta.outputs.tags }}; do
            cosign sign --yes "$ref"
          done
      - name: SBOM
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.name }}
